name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/check_public_release.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: node tests/test_ui.js && node tests/test_tps.js && node tests/test_question_preview.js && node tests/test_start_run.js && node tests/test_speed.js && node tests/test_model_picker.js && node tests/test_complete_response.mjs
      - run: node tests/test_inference_settings.mjs && node tests/test_inference_profile_editor.js
      - run: python3 tests/pi_native_integration.py
      - run: python3 tests/pi_explicit_integration.py
      - run: node --check ui/app.js && node --check harness/pi.mjs
      - run: python3 tests/pi_diagnostic_isolation.py
      - run: python3 tests/pi_file_worker_isolation.py
      - run: python3 tests/native_bank_isolation.py
      - run: python3 tests/native_controller_isolation.py
