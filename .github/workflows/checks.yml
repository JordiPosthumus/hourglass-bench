name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/check_public_release.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: node tests/test_ui.js && node tests/test_speed.js && node tests/test_model_picker.js && node tests/test_complete_response.mjs
      - run: node --check ui/app.js && node --check harness/pi.mjs
